        .org-nodo.nivel-1 .org-nombre { color:white; font-size:14px; }
        .org-tipo { font-size:10px; margin-top:4px; }
        .conector-v { width:2px; background:#c5cae9; height:25px; margin:0 auto; }
        .conector-h-cont { display:flex; justify-content:center; align-items:flex-start; gap:0; }

        .rama { display:flex; flex-direction:column; align-items:center; }

        .tasa-num { font-size:28px; font-weight:900; color:#1a237e; }

<script>
// ═══════════════════════════════════════
// FIREBASE SYNC — EL PRADO 1
// ═══════════════════════════════════════
const FB_RRHH_URL = 'https://elprado1-153ef-default-rtdb.firebaseio.com/rrhh';
const FB_RRHH_KEYS = ['personalFijoDB','personalEventualDB','actividadesDB',
  'asistFijoCierres','asistFijoPeriodoInicio','prestamosEventualDB',
  'retirosDB','saldoOcultos','smn_prado','cargosOrgExtra','orgEstructuraDB'];

async function fbRrhhGet(key) {
  try {
    const r = await fetch(FB_RRHH_URL + '/' + key + '.json');
    return await r.json();
  } catch(e) { return null; }
}

async function fbRrhhSet(key, val) {
  try {
    await fetch(FB_RRHH_URL + '/' + key + '.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
  } catch(e) { console.log('FB RRHH write error:', e); }
}

async function syncRrhhFromFirebase() {
  try {
    const r = await fetch(FB_RRHH_URL + '.json');
    const data = await r.json();
    if(data) {
      Object.entries(data).forEach(([key, val]) => {
        if(val !== null) localStorage.setItem(key, JSON.stringify(val));
      });
    }
    return true;
  } catch(e) { return false; }
}

// Interceptar localStorage para auto-sincronizar a Firebase
const _origSetItem = localStorage.setItem.bind(localStorage);
localStorage.setItem = function(key, value) {
  _origSetItem(key, value);
  if(FB_RRHH_KEYS.includes(key)) {
    try { fbRrhhSet(key, JSON.parse(value)); } catch(e) {}
  }
};

// Sincronizar al cargar
(async function() {
  await syncRrhhFromFirebase();
})();

</script>

<body>

<div class="barra-sup">

<header>

<div class="contenedor">

<script>
var meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function getCIsRetirados() {
    var retiros = JSON.parse(localStorage.getItem('retirosDB')) || [];
    var mapa = {};
    retiros.forEach(function(r){ if(r.ci) mapa[r.ci] = true; });
    return mapa;
}
function getPersonalFijo()     {
    var retirados = getCIsRetirados();
    return (JSON.parse(localStorage.getItem('personalFijoDB')) || []).filter(function(p){ return !retirados[p.ci]; });
}
function getPersonalEventual() {
    var retirados = getCIsRetirados();
    return (JSON.parse(localStorage.getItem('personalEventualDB')) || []).filter(function(p){ return !retirados[p.ci]; });
}
function getRetiros()          { return JSON.parse(localStorage.getItem('retirosDB'))           || []; }

// ═══════════════════════════════════════
// ESTRUCTURA EDITABLE DEL ORGANIGRAMA
// ═══════════════════════════════════════
// Cada nodo: {id, cargo, parentId, externo}
// parentId=null y externo=true → se muestra arriba de todo, sin línea de reporte (ej. Accionistas)
// parentId=null y externo=false → nodo raíz de la jerarquía (ej. Encargada de Campo)
const ORG_ESTRUCTURA_DEFAULT = [
  {id:'accionista', cargo:'Accionista', parentId:null, externo:true},
  {id:'supervision_externa', cargo:'Supervisión Externa', parentId:null, externo:true},
  {id:'encargada_campo', cargo:'Encargada de Campo', parentId:null, externo:false},
  {id:'jefe_almacen', cargo:'Jefe de Almacén y Maquinaria', parentId:'encargada_campo', externo:false},
  {id:'tractorista1', cargo:'Tractorista 1', parentId:'jefe_almacen', externo:false},
  {id:'tractorista2', cargo:'Tractorista 2', parentId:'jefe_almacen', externo:false},
  {id:'tractorista3', cargo:'Tractorista 3', parentId:'jefe_almacen', externo:false},
  {id:'capataz', cargo:'Capataz', parentId:'encargada_campo', externo:false},
  {id:'vaquero1', cargo:'Vaquero 1', parentId:'capataz', externo:false},
  {id:'vaquero2', cargo:'Vaquero 2', parentId:'capataz', externo:false},
  {id:'vaquero3', cargo:'Vaquero 3', parentId:'capataz', externo:false},
  {id:'vaquero4', cargo:'Vaquero 4', parentId:'capataz', externo:false},
  {id:'vaquero5', cargo:'Vaquero 5', parentId:'capataz', externo:false},
  {id:'vaquero6', cargo:'Vaquero 6', parentId:'capataz', externo:false},
  {id:'vaquero7', cargo:'Vaquero 7', parentId:'capataz', externo:false},
  {id:'pasante', cargo:'Pasante', parentId:'capataz', externo:false},
  {id:'supervisor_operaciones', cargo:'Supervisor de Operaciones', parentId:'encargada_campo', externo:false},
  {id:'portero', cargo:'Portero', parentId:'supervisor_operaciones', externo:false},
  {id:'coord_alimentacion', cargo:'Coordinadora de Alimentación', parentId:'supervisor_operaciones', externo:false},
  {id:'cocinera_represa', cargo:'Cocinera Campamento Represa', parentId:'coord_alimentacion', externo:false}
];
function getOrgEstructura() {
  var guardada = JSON.parse(localStorage.getItem('orgEstructuraDB'));
  return (guardada && guardada.length) ? guardada : ORG_ESTRUCTURA_DEFAULT.map(function(n){ return Object.assign({},n); });
}
function guardarOrgEstructura(est) {
  localStorage.setItem('orgEstructuraDB', JSON.stringify(est));
}
function slugify(texto) {
  return 'nodo_' + texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_' + Date.now().toString(36).slice(-4);
}

function getTodos() {
    var fijos = getPersonalFijo().map(function(p) {
        p._tipo = 'fijo';
        if(!p.nombre) p.nombre = p.nombreCompleto || (p.nombres+' '+p.paterno+' '+(p.materno||'')).trim();
        if(!p.nacimiento && p.fechaNacimiento) p.nacimiento = p.fechaNacimiento;
        return p;
    });
    var ev = getPersonalEventual().map(function(p) {
        p._tipo = 'eventual'; return p;
    });
    return fijos.concat(ev);
}

function getEdad(fechaStr) {
    if(!fechaStr) return null;
    var hoy = new Date();
    var nac = new Date(fechaStr);
    var edad = hoy.getFullYear() - nac.getFullYear();
    var m = hoy.getMonth() - nac.getMonth();
    if(m < 0 || (m===0 && hoy.getDate() < nac.getDate())) edad--;
    return edad;
}

function getAntiguedad(fechaStr) {
    if(!fechaStr) return null;
    var hoy = new Date();
    var ing = new Date(fechaStr);
    var anios = hoy.getFullYear() - ing.getFullYear();
    var m = hoy.getMonth() - ing.getMonth();
    if(m < 0 || (m===0 && hoy.getDate() < ing.getDate())) anios--;
    return anios;
}

function setTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('activo'); });
    if(btn) btn.classList.add('activo');
    ['estadisticas','organigrama','retiros'].forEach(function(t){
        document.getElementById('panel-'+t).style.display = t===tab ? 'block' : 'none';
    });
    if(tab==='estadisticas') renderEstadisticas();
    else if(tab==='organigrama') renderOrganigrama();
    else if(tab==='retiros') renderRetiros();
}

// ===================== ESTADÍSTICAS =====================
function renderEstadisticas() {
    var todos    = getTodos();
    var fijos    = todos.filter(function(p){ return p._tipo==='fijo'; });
    var eventuales = todos.filter(function(p){ return p._tipo==='eventual'; });

    // Excluir accionistas y supervisión externa de todos los cálculos
    var cargosExcluidos = ['Accionista', 'Supervisión Externa'];
    var fijosOp    = fijos.filter(function(p){ return cargosExcluidos.indexOf(p.cargo) === -1; });
    var todosOp    = todos.filter(function(p){ return cargosExcluidos.indexOf(p.cargo) === -1; });

    function promedioEdad(lista) {
        var con = lista.filter(function(p){ return getEdad(p.nacimiento)!==null; });
        if(!con.length) return '-';
        var sum = con.reduce(function(a,p){ return a + getEdad(p.nacimiento); }, 0);
        return (sum/con.length).toFixed(1);
    }
    function promedioAntiguedad(lista) {
        var con = lista.filter(function(p){ return getAntiguedad(p.ingreso)!==null; });
        if(!con.length) return '-';
        var sum = con.reduce(function(a,p){ return a + getAntiguedad(p.ingreso); }, 0);
        return (sum/con.length).toFixed(1);
    }

    var edadFijo    = promedioEdad(fijosOp);
    var edadGeneral = promedioEdad(todosOp);
    var antFijo     = promedioAntiguedad(fijosOp);

    // Distribución por cargo
    var cargos = {};
    todos.forEach(function(p) {
        var c = (p.cargo||p.categoriaLaboral||'Sin cargo').toUpperCase();
        if(!cargos[c]) cargos[c] = { fijo:0, eventual:0 };
        cargos[c][p._tipo==='fijo'?'fijo':'eventual']++;
    });

    // Distribución por rango de edad
    var rangos = { '18-25':0, '26-35':0, '36-45':0, '46-55':0, '55+':0 };
    todos.forEach(function(p) {
        var e = getEdad(p.nacimiento);
        if(e===null) return;
        if(e<=25) rangos['18-25']++;
        else if(e<=35) rangos['26-35']++;
        else if(e<=45) rangos['36-45']++;
        else if(e<=55) rangos['46-55']++;
        else rangos['55+']++;
    });

    var retiros = getRetiros();
    var html = '';

    // KPIs
    html += '<div class="kpi-grid">';
    html += kpi('Personal Operativo', todosOp.length, 'Fijo + Eventual (sin accionistas)', '#1a237e');
    html += kpi('Personal Fijo', fijosOp.length, 'Con contrato permanente', '#2e7d32');
    html += kpi('Personal Eventual', eventuales.length, 'Por actividad/quincena', '#e65100');
    html += kpi('Edad Prom. Fijo', edadFijo+' años', 'Solo personal fijo operativo', '#1565c0');
    html += kpi('Edad Prom. General', edadGeneral+' años', 'Fijo operativo + eventual', '#6a1b9a');
    html += kpi('Antigüedad Prom.', antFijo+' años', 'Personal fijo operativo', '#00695c');
    html += kpi('Total Retiros', retiros.length, 'Registrados en el sistema', '#c62828');
    html += '</div>';

    // Distribución por cargo
    html += '<h3>Distribución por Cargo</h3>';
    html += '<table class="tb"><thead><tr><th>Cargo</th><th>Fijo</th><th>Eventual</th><th>Total</th><th>Distribución</th></tr></thead><tbody>';
    var cargos = {};
    todosOp.forEach(function(p) {
        var c = (p.cargo||'Sin cargo');
        if(!cargos[c]) cargos[c] = { fijo:0, eventual:0 };
        cargos[c][p._tipo==='fijo'?'fijo':'eventual']++;
    });
    var maxCargo = Math.max.apply(null, Object.keys(cargos).map(function(c){ return cargos[c].fijo+cargos[c].eventual; }));
    Object.keys(cargos).sort().forEach(function(c) {
        var f = cargos[c].fijo; var e = cargos[c].eventual; var t = f+e;
        var pct = maxCargo>0 ? Math.round((t/maxCargo)*100) : 0;
        html += '<tr>'
            +'<td><strong>'+c+'</strong></td>'
            +'<td><span class="badge badge-fijo">'+f+'</span></td>'
            +'<td><span class="badge badge-eventual">'+e+'</span></td>'
            +'<td style="font-weight:bold;">'+t+'</td>'
            +'<td><span class="dist-barra" style="width:'+pct+'%;background:#3949ab;min-width:4px;">&nbsp;</span></td>'
            +'</tr>';
    });
    html += '</tbody></table>';

    // Distribución por rango de edad
    html += '<h3 style="margin-top:25px;">Distribución por Rango de Edad</h3>';
    html += '<table class="tb"><thead><tr><th>Rango</th><th>Cantidad</th><th>Distribución</th></tr></thead><tbody>';
    var rangos = { '18-25':0, '26-35':0, '36-45':0, '46-55':0, '55+':0 };
    todosOp.forEach(function(p) {
        var e = getEdad(p.nacimiento);
        if(e===null) return;
        if(e<=25) rangos['18-25']++;
        else if(e<=35) rangos['26-35']++;
        else if(e<=45) rangos['36-45']++;
        else if(e<=55) rangos['46-55']++;
        else rangos['55+']++;
    });
    var maxRango = Math.max.apply(null, Object.values(rangos));
    Object.keys(rangos).forEach(function(r) {
        var v = rangos[r];
        var pct = maxRango>0 ? Math.round((v/maxRango)*100) : 0;
        var color = r==='18-25'?'#43a047':r==='26-35'?'#1e88e5':r==='36-45'?'#8e24aa':r==='46-55'?'#f4511e':'#757575';
        html += '<tr>'
            +'<td><strong>'+r+' años</strong></td>'
            +'<td style="font-weight:bold;font-size:16px;">'+v+'</td>'
            +'<td><span class="dist-barra" style="width:'+(pct||4)+'%;background:'+color+';min-width:4px;">&nbsp;</span> '+v+'</td>'
            +'</tr>';
    });
    html += '</tbody></table>';

    // Listado completo (todos incluido accionistas para referencia)
    html += '<h3 style="margin-top:25px;">Plantel Completo</h3>';
    html += '<table class="tb"><thead><tr><th>Nombre</th><th>Tipo</th><th>Cargo</th><th>Edad</th><th>Antigüedad</th><th>Ingreso</th></tr></thead><tbody>';
    todos.sort(function(a,b){ return (a.nombre||a.nombreCompleto||'').localeCompare(b.nombre||b.nombreCompleto||''); }).forEach(function(p) {
        var edad = getEdad(p.nacimiento);
        var ant  = getAntiguedad(p.ingreso);
        var esExterno = cargosExcluidos.indexOf(p.cargo) > -1;
        html += '<tr style="'+(esExterno?'opacity:0.5;':'')+'">'
            +'<td><strong>'+(p.nombre||p.nombreCompleto||'-')+'</strong>'+(esExterno?' <span style="font-size:10px;color:#888;">(externo)</span>':'')+'</td>'
            +'<td><span class="badge badge-'+(p._tipo==='fijo'?'fijo':'eventual')+'">'+(p._tipo==='fijo'?'Fijo':'Eventual')+'</span></td>'
            +'<td>'+(p.cargo||'-')+'</td>'
            +'<td>'+(edad!==null?edad+' años':'-')+'</td>'
            +'<td>'+(ant!==null?(ant===0?'Menos de 1 año':ant+' año'+(ant!==1?'s':'')):'-')+'</td>'
            +'<td>'+(p.ingreso||'-')+'</td>'
            +'</tr>';
    });
    html += '</tbody></table>';

    document.getElementById('panel-estadisticas').innerHTML = html;
}

function kpi(label, valor, sub, color) {
    return '<div class="kpi-card" style="border-color:'+color+';">'
        +'<div class="kpi-label">'+label+'</div>'
        +'<div class="kpi-valor" style="color:'+color+';">'+valor+'</div>'
        +'<div class="kpi-sub">'+sub+'</div>'
        +'</div>';
}

// ===================== ORGANIGRAMA =====================
function abreviarNombreOrg(nombreCompleto) {
    if(!nombreCompleto) return '-';
    var partes = nombreCompleto.trim().split(/\s+/);
    if(partes.length <= 2) return partes.join(' ');
    return partes[0]+' '+partes[1];
}

function porCargoUnificadoOrg(cargo, fijos, eventuales) {
    var fijoMatch = fijos.filter(function(p){ return p.cargo === cargo; })
        .map(function(p){
            var n = p.nombreCompleto||p.nombre||((p.nombres||'')+' '+(p.paterno||'')).trim();
            return { nombre: abreviarNombreOrg(n), esEventual: false };
        });
    if(fijoMatch.length) return fijoMatch;
    return eventuales.filter(function(p){ return p.cargo === cargo; })
        .map(function(p){ return { nombre: abreviarNombreOrg(p.nombre||'-'), esEventual: true }; });
}

function nodoBoxHtmlOrg(cargo, personas) {
    if(!personas.length) {
        return '<div class="org-nodo" style="border:1.5px solid #c9c9c9;background:#f5f5f5;min-width:150px;max-width:190px;">'
            +'<div style="color:#888;opacity:0.85;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;">'+cargo+'</div>'
            +'<div style="color:#999;font-size:13px;">(Vacante)</div>'
            +'</div>';
    }
    return personas.map(function(p) {
        var border = p.esEventual ? '1.5px dashed #FFB74D' : '1.5px solid #185FA5';
        var bg     = p.esEventual ? '#FFF8E1' : '#E6F1FB';
        var color  = p.esEventual ? '#BF360C' : '#0C447C';
        var badge  = p.esEventual ? '<div style="font-size:9px;background:#FFB74D;color:#BF360C;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:3px;font-weight:bold;">EVENTUAL</div>' : '';
        return '<div class="org-nodo" style="border:'+border+';background:'+bg+';min-width:150px;max-width:190px;">'
            +'<div style="color:'+color+';opacity:0.85;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;">'+cargo+'</div>'
            +'<div style="color:'+color+';font-size:13px;font-weight:bold;">'+p.nombre+'</div>'
            +badge
            +'</div>';
    }).join('');
}

function renderNodoArbolOrg(nodoId, estructura, fijos, eventuales) {
    var nodo = estructura.find(function(n){ return n.id===nodoId; });
    if(!nodo) return '';
    var personas = porCargoUnificadoOrg(nodo.cargo, fijos, eventuales);
    var hijos = estructura.filter(function(n){ return n.parentId===nodoId; });
    var html = '<div style="display:flex;flex-direction:column;align-items:center;">';
    html += nodoBoxHtmlOrg(nodo.cargo, personas);
    if(hijos.length) {
        html += '<div style="width:2px;background:#c5cae9;height:20px;margin:0 auto;"></div>';
        html += '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">';
        hijos.forEach(function(h){ html += renderNodoArbolOrg(h.id, estructura, fijos, eventuales); });
        html += '</div>';
    }
    html += '</div>';
    return html;
}

function renderOrganigrama() {
    var fijos = getPersonalFijo();
    var eventuales = getPersonalEventual();
    var estructura = getOrgEstructura();
    var html = '<h3>Organigrama — Hacienda El Prado 1</h3>';
    html += '<div style="margin-bottom:14px;"><button onclick="toggleEditorOrg()" id="btn-editor-org" style="background:#1a237e;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;">✏️ Editar estructura</button></div>';
    html += '<div id="editor-org-panel" style="display:none;"></div>';

    if(!fijos.length && !estructura.some(function(n){return n.externo;})) {
        html += '<div class="sin-datos">No hay personal fijo registrado. Registrá el personal desde Registro de Personal Fijo.</div>';
        document.getElementById('panel-organigrama').innerHTML = html;
        return;
    }

    // Fila de externos (sin línea de reporte) — ej. Accionistas, Supervisión Externa
    var externos = estructura.filter(function(n){ return n.externo; });
    if(externos.length) {
        html += '<div style="display:flex;gap:20px;justify-content:center;margin-bottom:15px;flex-wrap:wrap;">';
        externos.forEach(function(nodo){
            var personas = porCargoUnificadoOrg(nodo.cargo, fijos, eventuales);
            var nombres = personas.length ? personas.map(function(p){return p.nombre;}) : ['(Vacante)'];
            html += '<div style="border:1.5px dashed #B4B2A9;border-radius:8px;padding:10px 16px;background:#F1EFE8;text-align:center;min-width:160px;">'
                +'<div style="font-size:10px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;">'+nodo.cargo+'</div>'
                + nombres.map(function(n){ return '<div style="font-size:12px;font-weight:bold;color:#444;">'+n+'</div>'; }).join('')
                +'</div>';
        });
        html += '</div>';
    }

    // Raíces de la jerarquía (parentId null, no externo)
    var raices = estructura.filter(function(n){ return !n.parentId && !n.externo; });
    html += '<div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;">';
    raices.forEach(function(r){ html += renderNodoArbolOrg(r.id, estructura, fijos, eventuales); });
    html += '</div>';

    // PERSONAL EVENTUAL sin cargo asignado en la estructura
    var cargosEnEstructura = estructura.map(function(n){ return n.cargo; });
    var evSinPuesto = eventuales.filter(function(p){ return !p.cargo || cargosEnEstructura.indexOf(p.cargo) === -1; });
    if(evSinPuesto.length) {
        html += '<div style="margin-top:25px;border-top:2px dashed #FFB74D;padding-top:15px;">';
        html += '<h3 style="color:#E65100;border-color:#FFB74D;">Personal Eventual — Sin puesto en la estructura</h3>';
        html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">';
        html += '<div style="background:#F5F5F5;border:1px solid #DDD;border-radius:8px;padding:10px 14px;">'
            + evSinPuesto.map(function(p){ return '<div style="font-size:12px;color:#555;">'+(p.nombre||'-')+(p.cargo?' — '+p.cargo:'')+'</div>'; }).join('')
            +'</div></div></div>';
    }

    document.getElementById('panel-organigrama').innerHTML = html;
    if(document.getElementById('editor-org-panel') && window._editorOrgAbierto) {
        renderEditorOrg();
        document.getElementById('editor-org-panel').style.display = '';
    }
}

// ═══════════════════════════════════════
// EDITOR DE ESTRUCTURA DEL ORGANIGRAMA
// ═══════════════════════════════════════
window._editorOrgAbierto = false;
function toggleEditorOrg() {
    window._editorOrgAbierto = !window._editorOrgAbierto;
    document.getElementById('btn-editor-org').textContent = window._editorOrgAbierto ? '✕ Cerrar editor' : '✏️ Editar estructura';
    var panel = document.getElementById('editor-org-panel');
    if(window._editorOrgAbierto) { renderEditorOrg(); panel.style.display=''; }
    else { panel.style.display='none'; }
}
function renderEditorOrg() {
    var estructura = getOrgEstructura();
    var html = '<div style="background:#fffde7;border:1px solid #fbc02d;border-radius:8px;padding:16px;margin-bottom:20px;">';
    html += '<h4 style="margin-top:0;color:#795548;">Editar estructura del organigrama</h4>';
    html += '<table class="tb"><thead><tr><th>Cargo / Nombre del puesto</th><th>Depende de</th><th>Tipo</th><th></th></tr></thead><tbody>';
    estructura.forEach(function(n, idx){
        html += '<tr>'
            +'<td><input type="text" value="'+n.cargo.replace(/"/g,'&quot;')+'" onchange="editarNodoOrg('+idx+',\'cargo\',this.value)" style="width:100%;padding:5px;border:1px solid #ccc;border-radius:4px;"></td>'
            +'<td><select onchange="editarNodoOrg('+idx+',\'parentId\',this.value)" style="width:100%;padding:5px;border:1px solid #ccc;border-radius:4px;">'
            +'<option value=""'+(!n.parentId?' selected':'')+'>— Ninguno (nivel superior) —</option>'
            + estructura.filter(function(o){return o.id!==n.id;}).map(function(o){
                return '<option value="'+o.id+'"'+(n.parentId===o.id?' selected':'')+'>'+o.cargo+'</option>';
              }).join('')
            +'</select></td>'
            +'<td><label style="font-size:11px;"><input type="checkbox" '+(n.externo?'checked':'')+' onchange="editarNodoOrg('+idx+',\'externo\',this.checked)"> Externo (sin línea)</label></td>'
            +'<td><button onclick="eliminarNodoOrg('+idx+')" style="background:#d32f2f;color:white;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;">Eliminar</button></td>'
            +'</tr>';
    });
    html += '</tbody></table>';
    html += '<button onclick="agregarNodoOrg()" style="margin-top:12px;background:#2e7d32;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;">+ Agregar puesto al organigrama</button>';
    html += '<div style="font-size:11px;color:#795548;margin-top:10px;">💡 El nombre del cargo tiene que coincidir exactamente con el que elegís en "Registro de Personal Fijo" para que la persona aparezca en su caja.</div>';
    html += '</div>';
    document.getElementById('editor-org-panel').innerHTML = html;
}
function editarNodoOrg(idx, campo, valor) {
    var estructura = getOrgEstructura();
    if(campo==='parentId') valor = valor || null;
    estructura[idx][campo] = valor;
    guardarOrgEstructura(estructura);
    renderOrganigrama();
}
function eliminarNodoOrg(idx) {
    var estructura = getOrgEstructura();
    var nodo = estructura[idx];
    if(estructura.some(function(n){return n.parentId===nodo.id;})) {
        alert('Este puesto tiene otros puestos debajo en el organigrama. Primero movelos o eliminalos a ellos.');
        return;
    }
    if(!confirm('¿Eliminar "'+nodo.cargo+'" del organigrama?')) return;
    estructura.splice(idx,1);
    guardarOrgEstructura(estructura);
    window._editorOrgAbierto = true;
    renderOrganigrama();
}
function agregarNodoOrg() {
    var nombre = prompt('Nombre del puesto nuevo (tiene que coincidir con el cargo cargado en Registro de Personal):');
    if(!nombre) return;
    nombre = nombre.trim();
    if(!nombre) return;
    var estructura = getOrgEstructura();
    estructura.push({id: slugify(nombre), cargo: nombre, parentId: null, externo: false});
    guardarOrgEstructura(estructura);
    window._editorOrgAbierto = true;
    renderOrganigrama();
}

// ===================== RETIROS =====================
function renderRetiros() {
    var todos   = getTodos();
    var retiros = getRetiros();
    var hoy     = new Date();

    // Tasa de rotación anual = (retiros del año / promedio personal) * 100
    var retirosAnio = retiros.filter(function(r) {
        return r.fecha && new Date(r.fecha).getFullYear() === hoy.getFullYear();
    }).length;
    var promedioPersonal = Math.max(todos.length + retiros.length, 1);
    var tasaRotacion = ((retirosAnio / promedioPersonal) * 100).toFixed(1);

    var html = '';

    // Tasa de rotación
    html += '<div class="tasa-box">'
        +'<div class="tasa-item"><div class="tasa-num" style="color:#1a237e;">'+retiros.length+'</div><div class="tasa-label">Total retiros registrados</div></div>'
        +'<div class="tasa-item"><div class="tasa-num" style="color:#d32f2f;">'+retirosAnio+'</div><div class="tasa-label">Retiros en '+hoy.getFullYear()+'</div></div>'
        +'<div class="tasa-item"><div class="tasa-num" style="color:'+(parseFloat(tasaRotacion)>20?'#d32f2f':parseFloat(tasaRotacion)>10?'#f57c00':'#2e7d32')+';">'+tasaRotacion+'%</div><div class="tasa-label">Tasa de rotación '+hoy.getFullYear()+'</div></div>'
        +'<div class="tasa-item"><div class="tasa-num" style="color:#1565c0;">'+todos.length+'</div><div class="tasa-label">Personal activo actual</div></div>'
        +'</div>';

    // Formulario nuevo retiro
    html += '<div class="form-retiro">'
        +'<h3 style="color:#e65100;border-color:#ffb74d;margin-top:0;">Registrar Retiro</h3>'
        +'<div class="form-row">'
        +'<div class="form-grupo"><label>Trabajador</label>'
        +'<select id="ret-persona" style="padding:8px;border:1px solid #ffcc80;border-radius:5px;">'
        +'<option value="">Seleccionar...</option>';

    todos.forEach(function(p) {
        var nombre = p.nombre || p.nombreCompleto || '-';
        html += '<option value="'+p.ci+'|'+nombre+'|'+p._tipo+'">'+nombre+' ('+(p._tipo==='fijo'?'Fijo':'Eventual')+')</option>';
    });

    html += '</select></div>'
        +'<div class="form-grupo"><label>Fecha de Retiro</label><input type="date" id="ret-fecha"></div>'
        +'<div class="form-grupo"><label>Motivo</label>'
        +'<select id="ret-motivo" style="padding:8px;border:1px solid #ffcc80;border-radius:5px;">'
        +'<option>Renuncia voluntaria</option>'
        +'<option>Fin de contrato</option>'
        +'<option>Despido</option>'
        +'<option>Abandono de trabajo</option>'
        +'<option>Fallecimiento</option>'
        +'<option>Jubilación</option>'
        +'<option>Otro</option>'
        +'</select></div>'
        +'</div>'
        +'<div class="form-row">'
        +'<div class="form-grupo"><label>¿Se pagaron beneficios?</label>'
        +'<select id="ret-beneficios" style="padding:8px;border:1px solid #ffcc80;border-radius:5px;"><option>Sí</option><option>No</option><option>Parcial</option></select></div>'
        +'<div class="form-grupo" style="flex:2;"><label>Observaciones</label><input type="text" id="ret-obs" placeholder="Notas adicionales..."></div>'
        +'</div>'
        +'<button class="btn-guardar-retiro" onclick="guardarRetiro()">Registrar Retiro</button>'
        +'</div>';

    // Historial
    html += '<h3>Historial de Retiros</h3>';
    if(!retiros.length) {
        html += '<div class="sin-datos">No hay retiros registrados.</div>';
    } else {
        html += '<table class="tb"><thead><tr><th>Trabajador</th><th>Tipo</th><th>Fecha Retiro</th><th>Motivo</th><th>Beneficios</th><th>Observaciones</th><th></th></tr></thead><tbody>';
        retiros.slice().reverse().forEach(function(r, idx) {
            html += '<tr>'
                +'<td><strong>'+r.nombre+'</strong></td>'
                +'<td><span class="badge badge-'+(r.tipo==='fijo'?'fijo':'eventual')+'">'+(r.tipo==='fijo'?'Fijo':'Eventual')+'</span></td>'
                +'<td>'+r.fecha+'</td>'
                +'<td>'+r.motivo+'</td>'
                +'<td>'+(r.beneficios||'-')+'</td>'
                +'<td>'+(r.obs||'-')+'</td>'
                +'<td><button onclick="eliminarRetiro('+r.id+')" style="background:#d32f2f;color:white;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;">Eliminar</button></td>'
                +'</tr>';
        });
        html += '</tbody></table>';
    }

    document.getElementById('panel-retiros').innerHTML = html;
}

function guardarRetiro() {
    var sel = document.getElementById('ret-persona').value;
    var fecha = document.getElementById('ret-fecha').value;
    if(!sel || !fecha) { alert('Seleccioná el trabajador y la fecha.'); return; }
    var partes = sel.split('|');
    var retiros = getRetiros();
    retiros.push({
        id: Date.now(),
        ci: partes[0],
        nombre: partes[1],
        tipo: partes[2],
        fecha: fecha,
        motivo: document.getElementById('ret-motivo').value,
        beneficios: document.getElementById('ret-beneficios').value,
        obs: document.getElementById('ret-obs').value
    });
    localStorage.setItem('retirosDB', JSON.stringify(retiros));
    alert('Retiro registrado.');
    renderRetiros();
}

function eliminarRetiro(id) {
    if(!confirm('¿Eliminar este registro?')) return;
    var retiros = getRetiros().filter(function(r){ return r.id!==id; });
    localStorage.setItem('retirosDB', JSON.stringify(retiros));
    renderRetiros();
}

window.onload = function() { renderEstadisticas(); };

<script>
(function() {
  var FB_URL = 'https://elprado1-153ef-default-rtdb.firebaseio.com';
  var RRHH_KEYS = ['personalFijoDB','personalEventualDB','actividadesDB',
    'asistFijoCierres','asistFijoPeriodoInicio','prestamosEventualDB',
    'retirosDB','saldoOcultos','smn_prado'];

  function fbWrite(path, val) {
    fetch(FB_URL + path + '.json', {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(val)
    }).catch(function(){});
  }

  var _orig = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, value) {
    _orig.call(this, key, value);
    try {
      if(RRHH_KEYS.indexOf(key) >= 0) fbWrite('/rrhh/' + key, JSON.parse(value));
    } catch(e) {}
  };

  window.addEventListener('load', function() {
    fetch(FB_URL + '/rrhh.json').then(function(r){ return r.json(); }).then(function(data) {
      if(data && typeof data === 'object') {
        Object.keys(data).forEach(function(key) {
          if(data[key] !== null) _orig.call(localStorage, key, JSON.stringify(data[key]));
        });
      }
    }).catch(function(){});

    var btn = document.createElement('button');
    btn.innerHTML = '&#x2601; Subir a Firebase';
    btn.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:99999;background:#e67e22;color:white;border:none;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;';
    btn.onclick = function() {
      btn.innerHTML = '&#x23F3; Subiendo...'; btn.disabled = true;
      RRHH_KEYS.forEach(function(key) {
        var v = localStorage.getItem(key);
        if(v) { try { fbWrite('/rrhh/' + key, JSON.parse(v)); } catch(e){} }
      });
      setTimeout(function() { btn.innerHTML='&#x2705; Listo!'; setTimeout(function(){ btn.innerHTML='&#x2601; Subir a Firebase'; btn.disabled=false; },3000); }, 2000);
    };
    document.body.appendChild(btn);
  });
})();
</script>
