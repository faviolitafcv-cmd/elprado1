<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Prado 1 — Acceso</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
#bg-foto{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
#bg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1}
.contenido{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px;}
.header{text-align:center;color:#fff;}
.header-hacienda{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:2px}
.header-titulo{font-family:Georgia,serif;font-size:44px;font-weight:700;letter-spacing:6px;text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.6);line-height:1;color:#fff}
.header-lugar{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:4px}

.login-card{
  background:rgba(15,26,11,.85);
  border:1px solid rgba(255,255,255,.15);
  border-radius:16px;
  padding:32px 36px;
  width:100%;
  max-width:380px;
  text-align:center;
}
.login-title{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#6dba3a;margin-bottom:24px;}

/* Usuario selector */
.usuarios-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.usr-btn{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:12px 16px;
  color:#d8e8c8;
  cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:all .2s;
  text-align:left;
}
.usr-btn:hover{background:rgba(109,186,58,.15);border-color:rgba(109,186,58,.4);}
.usr-btn.selected{background:rgba(109,186,58,.2);border-color:#6dba3a;}
.usr-avatar{width:36px;height:36px;border-radius:50%;background:rgba(109,186,58,.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.usr-nombre{font-size:13px;font-weight:600;color:#f0f8e8;}
.usr-rol{font-size:10px;color:#9ab888;margin-top:1px;}

/* PIN */
.pin-section{display:none;}
.pin-label{font-size:11px;color:#9ab888;letter-spacing:1px;margin-bottom:14px;}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);transition:all .2s;}
.pin-dot.filled{background:#6dba3a;border-color:#6dba3a;}
.pin-teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pin-key{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:14px;
  font-size:18px;
  font-weight:600;
  color:#f0f8e8;
  cursor:pointer;
  transition:all .15s;
  user-select:none;
}
.pin-key:hover{background:rgba(109,186,58,.2);border-color:#6dba3a;}
.pin-key:active{transform:scale(.95);}
.pin-key.borrar{font-size:14px;color:#9ab888;}
.pin-key.volver{font-size:12px;color:#9ab888;grid-column:1;}

.pin-error{color:#e05a4a;font-size:12px;margin-top:12px;display:none;}

.footer-txt{color:rgba(255,255,255,.3);font-size:10px;letter-spacing:2px;}
</style>
</head>
<body>
<img id="bg-foto" src="https://faviolitafcv-cmd.github.io/elprado1/foto_portada.jpg" onerror="this.style.display='none'">
<div id="bg-overlay"></div>

<div class="contenido">
  <div class="header">
    <div class="header-hacienda">Hacienda Ganadera</div>
    <div class="header-titulo">El Prado 1</div>
    <div class="header-lugar">San Ignacio de Velazco &nbsp;|&nbsp; Bolivia</div>
  </div>

  <div class="login-card">
    <!-- PASO 1: Elegir usuario -->
    <div id="secUsuarios">
      <div class="login-title">¿Quién sos?</div>
      <div class="usuarios-grid" id="listaUsuarios"></div>
    </div>

    <!-- PASO 2: PIN -->
    <div class="pin-section" id="secPin">
      <div class="login-title" id="pinLabel">Ingresá tu PIN</div>
      <div class="pin-dots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-teclado">
        <div class="pin-key" onclick="pinKey('1')">1</div>
        <div class="pin-key" onclick="pinKey('2')">2</div>
        <div class="pin-key" onclick="pinKey('3')">3</div>
        <div class="pin-key" onclick="pinKey('4')">4</div>
        <div class="pin-key" onclick="pinKey('5')">5</div>
        <div class="pin-key" onclick="pinKey('6')">6</div>
        <div class="pin-key" onclick="pinKey('7')">7</div>
        <div class="pin-key" onclick="pinKey('8')">8</div>
        <div class="pin-key" onclick="pinKey('9')">9</div>
        <div class="pin-key volver" onclick="volverUsuarios()">← Volver</div>
        <div class="pin-key" onclick="pinKey('0')">0</div>
        <div class="pin-key borrar" onclick="pinBorrar()">⌫</div>
      </div>
      <div class="pin-error" id="pinError">PIN incorrecto. Intentá de nuevo.</div>
    </div>
  </div>

  <div class="footer-txt">Sistema El Prado 1 &nbsp;|&nbsp; 2026</div>
</div>

<script>
const USUARIOS = [
  {nombre:'Faviola Zurita', pin:'1992', rol:'ADMIN', emoji:'👑'},
  {nombre:'David Arias',    pin:'4321', rol:'OPERADOR', emoji:'📝'},
  {nombre:'Eulices Vaca',   pin:'4123', rol:'OPERADOR', emoji:'📝'},
  {nombre:'Pasante1',       pin:'2134', rol:'OPERADOR', emoji:'📝'},
];

let usuarioSeleccionado = null;
let pinActual = '';

function renderUsuarios() {
  const lista = document.getElementById('listaUsuarios');
  lista.innerHTML = USUARIOS.map((u,i) => `
    <div class="usr-btn" onclick="selUsuario(${i})">
      <div class="usr-avatar">${u.emoji}</div>
      <div>
        <div class="usr-nombre">${u.nombre}</div>
        <div class="usr-rol">${u.rol === 'ADMIN' ? '👑 Administrador' : '📝 Operador'}</div>
      </div>
    </div>
  `).join('');
}

function selUsuario(i) {
  usuarioSeleccionado = USUARIOS[i];
  pinActual = '';
  document.getElementById('secUsuarios').style.display = 'none';
  document.getElementById('secPin').style.display = 'block';
  document.getElementById('pinLabel').textContent = 'PIN de ' + usuarioSeleccionado.nombre.split(' ')[0];
  actualizarDots();
}

function volverUsuarios() {
  pinActual = '';
  usuarioSeleccionado = null;
  document.getElementById('secUsuarios').style.display = 'block';
  document.getElementById('secPin').style.display = 'none';
  document.getElementById('pinError').style.display = 'none';
}

function pinKey(n) {
  if(pinActual.length >= 4) return;
  pinActual += n;
  actualizarDots();
  if(pinActual.length === 4) verificarPin();
}

function pinBorrar() {
  pinActual = pinActual.slice(0,-1);
  actualizarDots();
  document.getElementById('pinError').style.display = 'none';
}

function actualizarDots() {
  for(let i=0;i<4;i++) {
    document.getElementById('d'+i).className = 'pin-dot' + (i < pinActual.length ? ' filled' : '');
  }
}

function verificarPin() {
  setTimeout(() => {
    if(pinActual === usuarioSeleccionado.pin) {
      // Guardar sesión
      sessionStorage.setItem('ep_usuario', usuarioSeleccionado.nombre);
      sessionStorage.setItem('ep_rol', usuarioSeleccionado.rol);
      sessionStorage.setItem('ep_login', Date.now());
      // Ir al sistema
      window.location.href = 'gestion_elprado1.html';
    } else {
      document.getElementById('pinError').style.display = 'block';
      pinActual = '';
      actualizarDots();
    }
  }, 200);
}

// Verificar si ya hay sesión activa
const sesion = sessionStorage.getItem('ep_usuario');
const loginTime = parseInt(sessionStorage.getItem('ep_login')||0);
const horasDesde = (Date.now() - loginTime) / 3600000;
if(sesion && horasDesde < 8) {
  window.location.href = 'gestion_elprado1.html';
}

renderUsuarios();
</script>
</body>
</html>
